<style>
/* Layout: map left, panel right; on phones the map pins to the top and the list scrolls beneath.
   Palette: Guatemalan sky and color — celeste of the flag, quetzal green, Antigua's maize-yellow walls,
   bougainvillea pink, cempasúchil orange, jacaranda purple, Atitlán blue. */
:root{
  --cielo:#2E8FDA; --quetzal:#00936B; --maiz:#F2B807; --bugambilia:#D6337A; --cempasuchil:#E2670E; --jacaranda:#7D55C7; --lago:#1A5EA6;
  --bg:#F3F8FD; --water:#D8EBFA; --land:#FFFFFF; --land-edge:#B8CBE0; --neighbor:#EAF0F6; --neighbor-edge:#CFDAE6;
  --ink:#14213D; --muted:#53617A; --panel:#FFFFFF; --line:#D5E1EE; --hover:#EAF3FC; --shadow:rgba(16,40,80,.16);
  --f-display:"Alegreya", Georgia, "Times New Roman", serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1828; --water:#0E2236; --land:#192B43; --land-edge:#33507A; --neighbor:#12223A; --neighbor-edge:#223A5A;
  --ink:#EEF4FB; --muted:#A3B3C8; --panel:#14243A; --line:#28405F; --hover:#1C3352; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1828; --water:#0E2236; --land:#192B43; --land-edge:#33507A; --neighbor:#12223A; --neighbor-edge:#223A5A;
  --ink:#EEF4FB; --muted:#A3B3C8; --panel:#14243A; --line:#28405F; --hover:#1C3352; --shadow:rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;display:flex;flex-direction:column}
.faja{height:14px;flex:none;background:
  linear-gradient(135deg,var(--bg) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,var(--bg) 25%,transparent 25%) -7px 0/14px 14px,
  repeating-linear-gradient(90deg,var(--quetzal) 0 56px,var(--maiz) 56px 84px,var(--bugambilia) 84px 140px,var(--cielo) 140px 168px,var(--cempasuchil) 168px 224px,var(--jacaranda) 224px 252px,var(--lago) 252px 308px)}
.faja.thin{height:6px;background:repeating-linear-gradient(90deg,var(--quetzal) 0 56px,var(--maiz) 56px 84px,var(--bugambilia) 84px 140px,var(--cielo) 140px 168px,var(--cempasuchil) 168px 224px,var(--jacaranda) 224px 252px,var(--lago) 252px 308px)}

header{display:flex;align-items:flex-end;gap:6px 22px;flex-wrap:wrap;padding-block:12px 12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
header h1{font-family:var(--f-display);font-weight:900;font-size:clamp(2rem,3.4vw,3rem);margin:0;line-height:.95;letter-spacing:-.01em}
header h1 span{color:var(--bugambilia)}
.tag{margin:0 0 4px;color:var(--muted);font-size:1.1rem;text-wrap:balance}
.sample{margin-left:auto;margin-bottom:6px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:3px 8px;border-radius:4px}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;border-top:1px solid var(--line)}
.mapwrap{position:relative;min-height:0;background:var(--water);overflow:hidden}
#map{position:absolute;inset:0}

/* Leaflet overrides */
.leaflet-container{background:var(--water);font-family:var(--f-body)}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)!important;font-size:10px;opacity:.88;border-top-left-radius:6px}
.leaflet-control-attribution a{color:var(--muted)!important}
.nb{fill:var(--neighbor);fill-opacity:1;stroke:var(--neighbor-edge);stroke-width:.7}
.dept{fill:var(--land);fill-opacity:1;stroke:var(--land-edge);stroke-width:.9;transition:fill .6s,fill-opacity .6s}
.dept.tint{fill:color-mix(in srgb,var(--c) 26%,var(--land))}
.gt{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-opacity:.5}
.base-roads .nb,.base-satellite .nb{display:none}
.base-roads .dept{fill:transparent;fill-opacity:0;stroke:var(--lago);stroke-opacity:.35;stroke-dasharray:4 3}
.base-satellite .dept{fill:transparent;fill-opacity:0;stroke:#fff;stroke-opacity:.45;stroke-dasharray:4 3}
.base-roads .dept.tint,.base-satellite .dept.tint{fill:var(--c);fill-opacity:.2}
.base-satellite .gt{stroke:#fff}

.dlabel{pointer-events:none}
.dlabel span{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;font:600 12px var(--f-body);letter-spacing:.02em;color:var(--muted);opacity:0;transition:opacity .4s;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.show-dl .dlabel span{opacity:.9}
.homewrap{pointer-events:none}
.home{display:flex;align-items:center;gap:4px;transform:translate(-7px,-10px);white-space:nowrap}
.home .star{font-size:16px;color:var(--ink);line-height:1}
.home .hl{font:500 10px var(--f-mono);color:var(--ink);background:var(--panel);padding:1px 5px;border-radius:4px;opacity:.85}

.pinwrap{background:none;border:0}
.pin{position:relative;width:34px;height:44px;transition:opacity .25s}
.pin .face{position:absolute;left:2px;top:0;width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--fg);display:grid;place-items:center;font:800 11px var(--f-body);border:2.5px solid var(--panel);box-shadow:0 2px 6px var(--shadow);transition:transform .2s}
.pin::after{content:"";position:absolute;left:11px;top:27px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:15px solid var(--c)}
.pin .nm{position:absolute;left:35px;top:5px;white-space:nowrap;font:700 13px var(--f-body);color:var(--ink);background:var(--panel);padding:1px 8px;border-radius:999px;box-shadow:0 1px 4px var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.pinwrap:hover .nm,.pinwrap:focus .nm,.pinwrap.sel .nm,.pinwrap.latest .nm,.names-on .pinwrap .nm,.zoomed .pinwrap .nm{opacity:1}
.pinwrap.sel .face{border-color:var(--ink);transform:scale(1.18)}
.pinwrap:focus{outline:none}
.pinwrap:focus-visible .face{outline:3px solid var(--maiz);outline-offset:2px}
.has-sel .pinwrap:not(.sel) .pin{opacity:.42}
.pinwrap.out{display:none}
.pin.drop{animation:drop .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
.pin .rip{position:absolute;left:17px;top:15px;border-radius:50%;border:2px solid var(--c);animation:rip 1.6s .7s ease-out both;pointer-events:none}
@keyframes rip{from{width:24px;height:24px;margin:-12px;opacity:1}to{width:130px;height:130px;margin:-65px;opacity:0}}

/* Map overlays */
.ovl{position:absolute;z-index:500}
.basesw{top:12px;left:12px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 2px 8px var(--shadow)}
.basesw button{border:0;background:transparent;color:var(--ink);font:600 .88rem var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer}
.basesw button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.zoomctl{top:12px;right:12px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px var(--shadow)}
.zoomctl button{width:40px;height:40px;border:0;background:transparent;color:var(--ink);font:700 20px var(--f-body);cursor:pointer}
.zoomctl button+button{border-top:1px solid var(--line)}
.zoomctl button:hover,.basesw button:not([aria-pressed="true"]):hover{background:var(--hover)}
.fullpill{top:12px;left:50%;transform:translateX(-50%);border:0;background:var(--ink);color:var(--panel);font:700 .92rem var(--f-body);padding:9px 16px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px var(--shadow);white-space:nowrap}
.toast{top:64px;left:50%;transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));background:var(--ink);color:var(--panel);font:500 .95rem var(--f-body);padding:10px 14px;border-radius:10px;box-shadow:0 6px 18px var(--shadow)}
.toast input{display:block;width:100%;margin-top:6px;padding:6px 8px;border-radius:6px;border:0;font:500 .85rem var(--f-mono)}

.card{left:16px;bottom:24px;width:min(460px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;align-items:center;box-shadow:0 12px 32px var(--shadow)}
.card .av{grid-row:span 2;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--fg);font:800 1.45rem var(--f-display)}
.card .who{font:800 clamp(1.3rem,2.2vw,1.85rem)/1.1 var(--f-display);min-width:0}
.card .where{font-size:1.18rem;font-weight:700;min-width:0;grid-column:2/4}
.card .where span{font-weight:400;color:var(--muted)}
.card .x{grid-row:1;grid-column:3;align-self:start;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font:700 15px var(--f-body);cursor:pointer}
.card .x:hover{background:var(--hover)}
.card .others{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:.92rem;color:var(--muted)}
.card .others button{border:0;background:var(--hover);color:var(--ink);border-radius:999px;padding:4px 11px;font:600 .88rem var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.card .others button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.card .nav{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.card .nav button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .9rem var(--f-body);cursor:pointer}
.card .nav button:hover{background:var(--hover)}
.card .nav .pos{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.card .nav .copy{margin-left:auto}
.card.enter{animation:rise .5s ease both}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}

.finale{left:50%;top:64px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 32px var(--shadow)}
.finale .in{padding:16px 22px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.finale h2{margin:0;font:900 clamp(1.5rem,2.6vw,2.2rem)/1.1 var(--f-display);text-wrap:balance}
.finale p{margin:0;color:var(--muted);font-size:1.1rem}

/* Panel */
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.wheelbox{padding:16px 20px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.wheelbox .lbl{align-self:flex-start}
#wheel{width:100%;max-width:290px;aspect-ratio:1;display:block}
#wheelg{transform-box:view-box;transform-origin:150px 150px}
#wheel text{font-family:var(--f-body);font-weight:800;pointer-events:none}
.btns{display:flex;gap:8px;width:100%;flex-wrap:wrap}
button.primary{flex:1;border:0;border-radius:12px;padding:12px 18px;background:var(--bugambilia);color:#fff;font:800 1.05rem var(--f-body);cursor:pointer}
button.primary:disabled{opacity:.4;cursor:default}
button.ghost{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:transparent;color:var(--ink);font:600 .92rem var(--f-body);cursor:pointer;white-space:nowrap}
button.ghost:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,li:focus-visible,a:focus-visible{outline:3px solid var(--maiz);outline-offset:2px}
.hint{font-size:.8rem;color:var(--muted);align-self:flex-start;margin:0}
kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 4px}

.tools{padding:14px 20px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;padding:11px 38px 11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:500 1rem var(--f-body)}
.search input::placeholder{color:var(--muted)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--muted);font:700 15px var(--f-body);cursor:pointer}
.tog{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:transparent;color:var(--ink);font:600 .9rem var(--f-body);cursor:pointer;white-space:nowrap}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.roster{flex:1;min-height:0;overflow:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:10px}
.roster .grp h3{margin:8px 8px 4px;display:flex;justify-content:space-between}
.roster ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.roster li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;font-size:1rem;cursor:pointer}
.roster li:hover{background:var(--hover)}
.roster li.sel{background:var(--hover);box-shadow:inset 3px 0 0 var(--c)}
.roster li .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--fg);font:800 .72rem var(--f-body)}
.roster li .s{color:var(--muted);font-size:.86rem;text-align:right}
.roster li.wait{color:var(--muted)}
.roster li.wait .dot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.empty{color:var(--muted);padding:8px;font-size:.95rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.count{font-variant-numeric:tabular-nums}
.foot{font-size:.74rem;color:var(--muted);padding:8px 20px 10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:var(--muted)}

@media (max-width:900px){
  body{display:block;height:auto}
  main{display:block}
  .mapwrap{position:sticky;top:0;height:62vh;z-index:5;border-bottom:1px solid var(--line)}
  aside{border-left:0}
  .roster{overflow:visible}
  #wheel{max-width:230px}
  header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sample{margin-left:0}
  .tools{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .card{left:10px;bottom:22px;width:calc(100% - 20px);padding:12px 14px}
  .card .av{width:48px;height:48px;font-size:1.1rem}
  .card .where{font-size:1.02rem}
  .card .who{font-size:1.25rem}
  .card .nav{margin-top:8px;padding-top:8px}
  .card .nav button{padding:5px 10px}
  .basesw button{padding:6px 10px;font-size:.82rem}
  .zoomctl button{width:36px;height:36px}
  .fullpill{top:auto;bottom:22px}
  .card:not([hidden]) ~ .fullpill{display:none}
  .finale{top:56px}
}
@media (prefers-reduced-motion:reduce){.pin.drop,.card.enter,.pin .rip{animation:none}}
</style>
</head>
<body>
<div class="faja" aria-hidden="true"></div>
<header>
  <div class="brand">
    <span class="eyebrow">Peace Corps Guatemala</span>
    <h1>Kan <span>24</span></h1>
  </div>
  <p class="tag">Where we'll call home for the next two years.</p>
  <span class="sample" id="samplechip">Sample sites</span>
</header>
<main>
  <div class="mapwrap base-simple" id="mapwrap">
    <div id="map" aria-label="Map of Guatemala with Kan 24 sites"></div>
    <div class="ovl basesw" role="group" aria-label="Map style">
      <button data-base="simple" aria-pressed="true">Simple</button>
      <button data-base="roads" aria-pressed="false">Roads</button>
      <button data-base="satellite" aria-pressed="false">Satellite</button>
    </div>
    <div class="ovl zoomctl">
      <button id="zin" aria-label="Zoom in" title="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out" title="Zoom out">−</button>
    </div>
    <div class="ovl card" id="card" hidden></div>
    <button class="ovl fullpill" id="fullpill" hidden>Show all of Guatemala</button>
    <div class="ovl toast" id="toast" role="status" hidden></div>
    <div class="ovl finale" id="finale" hidden></div>
  </div>
  <aside>
    <div id="revealPanel" hidden>
      <div class="wheelbox">
        <p class="lbl">Who's next</p>
        <svg id="wheel" viewBox="0 0 300 300" aria-hidden="true">
          <g id="wheelg"></g>
          <circle cx="150" cy="150" r="22" style="fill:var(--panel);stroke:var(--line)" stroke-width="2"></circle>
          <path d="M150 26 L138 8 L162 8 Z" style="fill:var(--ink)"></path>
        </svg>
        <div class="btns"><button class="primary" id="spin">Spin the wheel</button></div>
        <p class="hint"><kbd>Space</kbd> spin · tap a waiting name to place them directly</p>
      </div>
    </div>
    <div id="explorePanel" hidden>
      <div class="tools">
        <div class="search">
          <input id="q" type="search" placeholder="Find a name, town or department" autocomplete="off" aria-label="Search">
          <button id="qclear" aria-label="Clear search" hidden>✕</button>
        </div>
        <button class="tog" id="tNames" aria-pressed="false">Names</button>
      </div>
    </div>
    <div class="roster" id="roster"></div>
    <div class="btns" id="revealBtns" style="padding:0 20px 14px" hidden>
      <button class="ghost" id="all">Place everyone</button>
      <button class="ghost" id="reset">Start over</button>
    </div>
    <div class="foot">
      <span>★ Magdalena, where we trained</span>
      <a href="#reveal" id="modeLink">Reveal mode</a>
    </div>
  </aside>
</main>
<div class="faja thin" aria-hidden="true"></div>

const PALETTE = [["--quetzal","#fff"],["--bugambilia","#fff"],["--maiz","#2A1F00"],["--cielo","#fff"],["--jacaranda","#fff"],["--cempasuchil","#fff"],["--lago","#fff"]];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const first = p => p.name.split(/\s+/)[0];
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const norm = s => { const k=s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); return k==="quetzaltenango"?"quezaltenango":k; };
const vars = p => `--c:var(${p.c});--fg:${p.fg}`;

COHORT.forEach((p,i)=>{ p.id=i; p.slug=slug(p.name); [p.c,p.fg]=PALETTE[i%PALETTE.length];

$("samplechip").hidden = !SAMPLE_SITES;

/* ---------- map ---------- */

const deptLayer = L.geoJSON(DEPTS,{pane:"basePane",interactive:false,style:()=>({className:"dept"})}).addTo(map);
L.geoJSON(NB.features.find(f=>f.properties.name==="Guatemala"),{pane:"basePane",interactive:false,style:()=>({className:"gt"})}).addTo(map);
deptLayer.eachLayer(l=>{

});
L.marker([HOME.lat,HOME.lon],{pane:"labelPane",interactive:false,keyboard:false,icon:L.divIcon({className:"homewrap",html:`<div class="home"><span class="star">★</span><span class="hl">Magdalena</span></div>`,iconSize:[0,0]})}).addTo(map);

map.fitBounds(GT,{padding:[16,16],animate:false});
let fitZoom = map.getZoom();
function zoomFor(){ return base==="simple" ? 9.5 : 12.5; }
function updateZoomUI(){
  const z=map.getZoom();
  mapEl.classList.toggle("zoomed", z>=9.25);
  mapEl.classList.toggle("show-dl", base==="simple" && z>=fitZoom+1);
  $("fullpill").hidden = !(z>fitZoom+.75 || selected);
}
map.on("zoomend moveend",updateZoomUI);
addEventListener("resize",()=>{ map.invalidateSize(); });

function waitMove(ms){ return new Promise(res=>{ let done=false; const f=()=>{ if(!done){done=true;res();} }; map.once("moveend",f); setTimeout(f,ms); }); }
function fitAll(dur=1){
  if(reduce){ map.fitBounds(GT,{padding:[16,16],animate:false}); return Promise.resolve(); }
  const w=waitMove(dur*1000+400); map.flyToBounds(GT,{padding:[16,16],duration:dur}); return w;
}
function flyToP(p,z,dur=1.2){
  const target=L.latLng(p.lat,p.lon);
  const shift = innerWidth<=900 ? map.getSize().y*.2 : map.getSize().y*.06;
  const center = map.unproject(map.project(target,z).add([0,shift]),z);
  if(reduce){ map.setView(center,z,{animate:false}); return Promise.resolve(); }
  const w=waitMove(dur*1000+500); map.flyTo(center,z,{duration:dur}); return w;
}
$("zin").onclick=()=>map.zoomIn();
$("zout").onclick=()=>map.zoomOut();
$("fullpill").onclick=()=>{ clearSelection(); fitAll(); };
map.on("click",()=>clearSelection());

/* ---------- base maps ---------- */
const TILE_DEFS = {
  roads:[["https://tile.openstreetmap.org/{z}/{x}/{y}.png",'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors']],
  satellite:[["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}","Imagery © Esri, Maxar, Earthstar Geographics"],
             ["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",""]]
};
const LABELS = {simple:"Simple",roads:"Roads",satellite:"Satellite"};
const tiles = {};
let base = "simple", baseToken = 0;
function setBase(name){
  if(!LABELS[name]) name="simple";
  for(const [k,ls] of Object.entries(tiles)) if(k!==name) ls.forEach(l=>map.removeLayer(l));
  base=name;
  mapEl.classList.remove("base-simple","base-roads","base-satellite"); mapEl.classList.add("base-"+name);
  document.querySelectorAll(".basesw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.base===name));
  try{ localStorage.setItem("kan24-base",name); }catch(e){}
  if(name==="simple"){ map.setMaxZoom(12); }
  else{
    map.setMaxZoom(18);
    if(!tiles[name]) tiles[name]=TILE_DEFS[name].map(([u,a])=>L.tileLayer(u,{maxZoom:18,attribution:a}));
    const main=tiles[name][0]; let ok=false, err=0; const token=++baseToken;
    main.off("tileload tileerror"); main.on("tileload",()=>ok=true); main.on("tileerror",()=>err++);
    tiles[name].forEach(l=>l.addTo(map));
    setTimeout(()=>{ if(token===baseToken && base===name && !ok && err>0){
      toast(`The ${LABELS[name]} map couldn't load here. It needs an internet connection and works on the hosted site. Showing the simple map for now.`,6000);
      setBase("simple"); } },4500);
  }
  updateZoomUI();
}
document.querySelectorAll(".basesw button").forEach(b=>b.onclick=()=>setBase(b.dataset.base));

let toastTimer;
function toast(html,ms=2600){ const t=$("toast"); t.innerHTML=html; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,ms); }

/* ---------- state ---------- */
const params = new URLSearchParams(location.search);
let mode = (params.has("reveal") || location.hash==="#reveal") ? "reveal" : "explore";
let placed=[], waiting=[], busy=false, rot=0, selected=null, query="", order=[];
const markers = new Map();

/* ---------- pins ---------- */
function addMarker(p,animate){
  const a = animate && !reduce;
  const html = `<div class="pin${a?" drop":""}" style="${vars(p)}">${a?'<span class="rip"></span>':""}<span class="face">${p.ini}</span><span class="nm">${esc(first(p))}</span></div>`;
  const m = L.marker([p.lat,p.lon],{title:`${p.name}, ${p.site}`,riseOnHover:true,
    icon:L.divIcon({className:"pinwrap",html,iconSize:[34,44],iconAnchor:[17,44]})}).addTo(map);
  m.on("click",()=>{ if(selected===p && mode==="explore") clearSelection(); else select(p); });
  markers.set(p.id,m);
  return m;
}
function tintDepts(list){
  deptLayer.eachLayer(l=>{
    const el=l.getElement(); if(!el) return;
    const hit=list.filter(q=>norm(q.dept)===norm(l.feature.properties.name)).pop();
    el.classList.toggle("tint",!!hit);
    if(hit) el.style.setProperty("--c",`var(${hit.c})`);
  });
}

/* ---------- selection ---------- */
function select(p,{fly=true,animate=false}={}){
  selected=p;
  markers.forEach((m,id)=>{ const el=m.getElement(); if(el) el.classList.toggle("sel",id===p.id); m.setZIndexOffset(id===p.id?1000:0); });
  mapEl.classList.toggle("has-sel",mode==="explore");
  tintDepts(mode==="explore"?[p]:placed);
  showCard(p,animate);
  document.querySelectorAll(".roster li").forEach(li=>{ li.classList.toggle("sel",+li.dataset.id===p.id); });
  const li=document.querySelector(`.roster li[data-id="${p.id}"]`);
  if(li && innerWidth>900) li.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"});
  if(mode==="explore") try{ history.replaceState(null,"","#"+p.slug); }catch(e){}
  if(fly) flyToP(p, Math.max(map.getZoom(), zoomFor()), 1);
  updateZoomUI();
}
function clearSelection(){
  $("card").hidden=true;
  if(!selected) return;
  selected=null;
  markers.forEach(m=>{ const el=m.getElement(); if(el) el.classList.remove("sel"); m.setZIndexOffset(0); });
  mapEl.classList.remove("has-sel");
  tintDepts(mode==="reveal"?placed:[]);
  document.querySelectorAll(".roster li.sel").forEach(li=>li.classList.remove("sel"));
  if(mode==="explore") try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  updateZoomUI();
}
function step(d){
  if(!selected || !order.length) return;
  const i=order.indexOf(selected);
  select(order[(i+d+order.length)%order.length]);
}
function showCard(p,animate){
  const pool = mode==="reveal" ? placed : COHORT;
  const others = pool.filter(q=>q!==p && norm(q.dept)===norm(p.dept));
  const i = order.indexOf(p);
  const c=$("card");
  c.hidden=false; c.className="ovl card"+(animate&&!reduce?" enter":"");
  c.style.cssText=vars(p);
  c.innerHTML=`<div class="av">${p.ini}</div>
    <div class="who">${esc(p.name)}</div>
    <button class="x" id="cardx" aria-label="Close">✕</button>
    <div class="where">${esc(p.site)}<span> · ${esc(p.dept)}</span></div>
    ${others.length?`<div class="others"><span>Also in ${esc(p.dept)}:</span>${others.map(q=>`<button data-id="${q.id}" style="${vars(q)}"><i></i>${esc(first(q))}</button>`).join("")}</div>`:""}
    ${mode==="explore"?`<div class="nav"><button id="prev" aria-label="Previous person">‹ Prev</button><span class="pos">${i+1} of ${order.length}</span><button id="next" aria-label="Next person">Next ›</button><button class="copy" id="copy">Copy link</button></div>`:""}`;
  $("cardx").onclick=clearSelection;
  c.querySelectorAll(".others button").forEach(b=>b.onclick=()=>select(COHORT[+b.dataset.id]));
  if(mode==="explore"){
    $("prev").onclick=()=>step(-1); $("next").onclick=()=>step(1);
    $("copy").onclick=()=>{
      const url=location.href.split("#")[0].split("?")[0]+"#"+p.slug;
      const fallback=()=>{ toast(`Copy this link:<input id="cl" value="${esc(url)}" readonly>`,9000); const inp=$("cl"); inp.focus(); inp.select(); };
      try{ navigator.clipboard.writeText(url).then(()=>toast(`Link to ${esc(first(p))} copied`),fallback); }catch(e){ fallback(); }
    };
  }
}

/* ---------- list ---------- */
function li(p,state){
  return `<li class="${state}${selected===p?" sel":""}" data-id="${p.id}" tabindex="0" style="${vars(p)}"><span class="dot">${p.ini}</span><span>${esc(p.name)}</span><span class="s">${state==="wait"?"":esc(p.site)}</span></li>`;
}
function renderRoster(){
  const R=$("roster");
  if(mode==="reveal"){
    order=[...placed];
    R.innerHTML=`<div class="grp"><h3 class="lbl">On the map <span class="count">${placed.length} / ${COHORT.length}</span></h3><ul>${[...placed].reverse().map(p=>li(p,"placed")).join("")}</ul></div>
      ${waiting.length?`<div class="grp"><h3 class="lbl">Still to come <span class="count">${waiting.length}</span></h3><ul>${waiting.map(p=>li(p,"wait")).join("")}</ul></div>`:""}`;
    return;
  }
  const q=norm(query);
  const hits=COHORT.filter(p=>!q||norm(p.name).includes(q)||norm(p.site).includes(q)||norm(p.dept).includes(q));
  const groups=[...new Set(hits.map(p=>p.dept))].sort((a,b)=>a.localeCompare(b)).map(d=>[d,hits.filter(p=>p.dept===d).sort((a,b)=>a.name.localeCompare(b.name))]);
  order=groups.flatMap(g=>g[1]);
  R.innerHTML = hits.length ? groups.map(([d,ps])=>`<div class="grp"><h3 class="lbl">${esc(d)}<span class="count">${ps.length}</span></h3><ul>${ps.map(p=>li(p,"placed")).join("")}</ul></div>`).join("")
    : `<p class="empty">No one matches “${esc(query)}”. <button class="tog" id="qreset">Clear search</button></p>`;
  const qr=$("qreset"); if(qr) qr.onclick=clearSearch;
  markers.forEach((m,id)=>{ const el=m.getElement(); if(el) el.classList.toggle("out",!hits.some(p=>p.id===id)); });
}
function onList(e){
  const el=e.target.closest("li"); if(!el) return; const p=COHORT[+el.dataset.id];
  if(el.classList.contains("wait")){ if(!busy){ busy=true; $("spin").disabled=true; reveal(p).then(()=>{busy=false; $("spin").disabled=!waiting.length;}); } return; }
  if(selected===p && mode==="explore"){ clearSelection(); return; }
  select(p);
}
$("roster").addEventListener("click",onList);
$("roster").addEventListener("keydown",e=>{ if(e.key==="Enter") onList(e); });

/* ---------- search & names ---------- */
function clearSearch(){ query=""; $("q").value=""; $("qclear").hidden=true; renderRoster(); }
$("q").addEventListener("input",e=>{ query=e.target.value; $("qclear").hidden=!query; renderRoster(); });
$("q").addEventListener("keydown",e=>{
  if(e.key==="Escape"){ clearSearch(); e.stopPropagation(); }
  if(e.key==="Enter" && order.length){ select(order[0]); $("q").blur(); }
});
$("qclear").onclick=()=>{ clearSearch(); $("q").focus(); };
$("tNames").onclick=e=>{ const on=!mapEl.classList.contains("names-on"); mapEl.classList.toggle("names-on",on); e.currentTarget.setAttribute("aria-pressed",on); };

/* ---------- reveal ---------- */
async function reveal(p,{fast=false}={}){
  waiting=waiting.filter(q=>q!==p); placed.push(p);
  markers.forEach(m=>{ const el=m.getElement(); if(el) el.classList.remove("latest"); });
  $("finale").hidden=true;
  if(!fast){ clearSelection(); await fitAll(.8); await flyToP(p, zoomFor(), 1.8); }
  const m=addMarker(p,!fast);
  if(!fast){ const el=m.getElement(); if(el) el.classList.add("latest"); select(p,{fly:false,animate:true}); }
  else tintDepts(placed);
  renderRoster(); drawWheel();
  if(!waiting.length) setTimeout(finale, fast?250:2600);
}
function finale(){
  clearSelection(); fitAll(1.4); tintDepts(placed);
  const depts=new Set(placed.map(p=>norm(p.dept))).size;
  const f=$("finale");
  f.innerHTML=`<div class="faja thin"></div><div class="in"><h2>Kan 24 is on the map.</h2><p>${placed.length} new homes across ${depts} departments.</p><button class="primary" id="goExplore">Explore the map</button></div>`;
  f.hidden=false;
  $("goExplore").onclick=()=>setMode("explore");
}

const WC=150, WR=142, WR0=24;
function arcPath(a0,a1){
  const pt=(r,a)=>`${(WC+r*Math.sin(a)).toFixed(2)},${(WC-r*Math.cos(a)).toFixed(2)}`;
  const lg=(a1-a0)>Math.PI?1:0;
  return `M${pt(WR,a0)}A${WR},${WR} 0 ${lg} 1 ${pt(WR,a1)}L${pt(WR0,a1)}A${WR0},${WR0} 0 ${lg} 0 ${pt(WR0,a0)}Z`;
}
function drawWheel(){
  const g=$("wheelg"); g.style.transition="none"; g.style.transform="rotate(0deg)"; rot=0;
  const n=waiting.length;
  if(!n){ g.innerHTML=`<circle cx="${WC}" cy="${WC}" r="${WR}" style="fill:var(--line)"></circle><text x="${WC}" y="${WC-42}" text-anchor="middle" font-size="16" style="fill:var(--muted)">Everyone's on the map</text>`; $("spin").disabled=true; return; }
  const a=2*Math.PI/n, fs=n>18?10:n>10?12:14;
  g.innerHTML = waiting.map((p,i)=>{
    const s=i*a, e=n===1?s+2*Math.PI-1e-4:s+a, deg=((s+e)/2)*180/Math.PI-90;
    return `<path d="${arcPath(s,e)}" style="fill:var(${p.c});stroke:var(--panel)" stroke-width="1.5"></path>
      <text transform="translate(${WC},${WC}) rotate(${deg.toFixed(2)}) translate(${WR-10},0)" text-anchor="end" dominant-baseline="central" font-size="${fs}" style="fill:${p.fg}">${esc(first(p))}</text>`;
  }).join("");
  $("spin").disabled=busy;
}
function spin(){
  if(mode!=="reveal"||busy||!waiting.length) return; busy=true; $("spin").disabled=true;
  const n=waiting.length, idx=Math.floor(Math.random()*n), seg=360/n;
  const center=(idx+.5)*seg+(Math.random()-.5)*seg*.6;
  const target=rot+360*(reduce?0:5)+((360-center-(rot%360))%360+360)%360; rot=target;
  const g=$("wheelg"), dur=reduce?0:4200;
  g.style.transition=`transform ${dur}ms cubic-bezier(.12,.6,.1,1)`;
  requestAnimationFrame(()=>{ g.style.transform=`rotate(${target}deg)`; });
  setTimeout(async()=>{ await reveal(waiting[idx]); busy=false; $("spin").disabled=!waiting.length; }, dur+350);
}
$("spin").onclick=spin;
$("all").onclick=async()=>{ if(busy) return; busy=true; $("spin").disabled=true; clearSelection(); await fitAll(.5);
  for(const p of [...waiting]){ await reveal(p,{fast:true}); await new Promise(r=>setTimeout(r,reduce?0:110)); } busy=false; };
$("reset").onclick=()=>{ if(!busy) setMode("reveal"); };

/* ---------- modes ---------- */
function resetMap(){
  markers.forEach(m=>map.removeLayer(m)); markers.clear();
  selected=null; $("card").hidden=true; $("finale").hidden=true;
  mapEl.classList.remove("has-sel","names-on"); $("tNames").setAttribute("aria-pressed","false");
  tintDepts([]);
}
function setMode(m){
  mode=m; resetMap();
  $("revealPanel").hidden = m!=="reveal"; $("revealBtns").hidden = m!=="reveal"; $("explorePanel").hidden = m!=="explore";
  $("modeLink").textContent = m==="reveal" ? "Explore mode" : "Reveal mode";
  if(m==="reveal"){ placed=[]; waiting=[...COHORT]; drawWheel(); }
  else { placed=[...COHORT]; waiting=[]; COHORT.forEach(p=>addMarker(p,false)); clearSearch(); }
  renderRoster(); fitAll(.8);
  try{ history.replaceState(null,"",location.pathname+(m==="reveal"?"?reveal":"")); }catch(e){}
}
$("modeLink").onclick=e=>{ e.preventDefault(); setMode(mode==="reveal"?"explore":"reveal"); };

document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t.closest && t.closest("input")) return;
  if(e.key==="Escape"){ if(selected) clearSelection(); else fitAll(); return; }
  if(t.closest && t.closest("button,li,.leaflet-marker-icon")) return;
  if(e.code==="Space" && mode==="reveal"){ e.preventDefault(); spin(); }
  if(mode==="explore" && selected && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ e.preventDefault(); step(e.key==="ArrowRight"?1:-1); }
});

/* ---------- start ---------- */
const startHash = location.hash.slice(1);
let savedBase="simple"; try{ savedBase=localStorage.getItem("kan24-base")||"simple"; }catch(e){}
setBase(mode==="reveal" ? "simple" : savedBase);
setMode(mode);
if(mode==="explore" && startHash){
  const p=COHORT.find(q=>q.slug===startHash); if(p) setTimeout(()=>select(p),600);
}
</script>
